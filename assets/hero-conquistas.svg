<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 730" role="img" aria-labelledby="title desc">
<title id="title">Conquistas e planos para o futuro</title><desc id="desc">Ilustração contemporânea de um imóvel, um veículo e uma paisagem ao entardecer, em cores institucionais da Astrion</desc>
<defs>
  <linearGradient id="sky" x2=".8" y2="1"><stop stop-color="#0C2C57"/><stop offset=".45" stop-color="#336898"/><stop offset=".75" stop-color="#82A8C6"/><stop offset="1" stop-color="#F1BDA5"/></linearGradient>
  <radialGradient id="sun"><stop stop-color="#FFEDD3" stop-opacity=".9"/><stop offset="1" stop-color="#F8D7AF" stop-opacity="0"/></radialGradient>
  <linearGradient id="water" x2="0" y2="1"><stop stop-color="#1A547F"/><stop offset="1" stop-color="#0D315B"/></linearGradient>
  <linearGradient id="home" x2="0" y2="1"><stop stop-color="#F6F6F2"/><stop offset="1" stop-color="#A6B7BF"/></linearGradient>
  <linearGradient id="glass" x2=".8" y2="1"><stop stop-color="#99C8D4"/><stop offset=".55" stop-color="#214E70"/><stop offset="1" stop-color="#102F51"/></linearGradient>
  <linearGradient id="car" x2="0" y2="1"><stop stop-color="#D9E4EC"/><stop offset=".5" stop-color="#6C859E"/><stop offset="1" stop-color="#1A344F"/></linearGradient>
  <filter id="blur"><feGaussianBlur stdDeviation="18"/></filter>
  <filter id="shadow"><feDropShadow dx="0" dy="15" stdDeviation="15" flood-color="#06152B" flood-opacity=".5"/></filter>
  <filter id="glow"><feGaussianBlur stdDeviation="4"/></filter>
</defs>
