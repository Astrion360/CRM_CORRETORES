name: Generate approved ORBITA 4K presentation asset
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/orbita-4k.yml'
      - 'assets/orbita-approved-final.png.png'
permissions:
  contents: write
jobs:
  upscale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --quiet Pillow
      - name: Enhance approved source without redesign
        run: |
          python - <<'PY'
          from PIL import Image, ImageFilter
          src='assets/orbita-approved-final.png.png'
          dst='assets/orbita-approved-4k.webp'
          im=Image.open(src).convert('RGB')
          im=im.resize((im.width*3,im.height*3), Image.Resampling.LANCZOS)
          im=im.filter(ImageFilter.UnsharpMask(radius=1.3, percent=94, threshold=2))
          im.save(dst, 'WEBP', quality=96, method=6)
          print('Generated', dst, im.size)
          PY
      - name: Commit enhanced artwork to main
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/orbita-approved-4k.webp
          if ! git diff --cached --quiet; then
            git commit -m 'Create optimized high-resolution approved ORBITA panel'
            git push
          fi
